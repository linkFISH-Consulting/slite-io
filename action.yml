name: slite-io
description: Mirror Markdown/MDX files from the workspace into a Slite folder

inputs:
  target-folder:
    description: Absolute Slite folder path, starting at a root channel
    required: true
  include-files:
    description: Single cwd-relative glob for files to upload
    required: true
  exclude-files:
    description: Optional cwd-relative glob for files to exclude
    required: false
    default: ""
  header-edit-url:
    description: Edit URL template; supports {filename} and {file_basename}
    required: false
    default: ""
  upload-format:
    description: Slite API content field, either markdown or sliteml
    required: false
    default: "markdown"
  overwrite:
    description: Update notes that already exist instead of skipping them
    required: false
    default: "true"
  slite-api-key:
    description: Slite API key
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: https://data.forgejo.org/actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install slite-io
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check "$ACTION_PATH"

    - name: Upload documentation to Slite
      shell: bash
      env:
        SLITE_API_KEY: ${{ inputs.slite-api-key }}
        TARGET_FOLDER: ${{ inputs.target-folder }}
        INCLUDE_FILES: ${{ inputs.include-files }}
        EXCLUDE_FILES: ${{ inputs.exclude-files }}
        HEADER_EDIT_URL: ${{ inputs.header-edit-url }}
        UPLOAD_FORMAT: ${{ inputs.upload-format }}
        OVERWRITE: ${{ inputs.overwrite }}
      run: |
        set -euo pipefail
        args=(
          upload-batch
          --target-folder "$TARGET_FOLDER"
          --include-files "$INCLUDE_FILES"
          --upload-format "$UPLOAD_FORMAT"
          --apply
        )
        if [ -n "$EXCLUDE_FILES" ]; then
          args+=(--exclude-files "$EXCLUDE_FILES")
        fi
        if [ -n "$HEADER_EDIT_URL" ]; then
          args+=(--header-edit-url "$HEADER_EDIT_URL")
        fi
        if [ "$OVERWRITE" = "true" ]; then
          args+=(--overwrite)
        fi
        slite-io "${args[@]}"
